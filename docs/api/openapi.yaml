openapi: 3.1.0
info:
  title: AgencyOS API
  description: Backend for the AI Outreach Agency Operating System.
  version: 0.1.0
paths:
  /api/v1/health/live:
    get:
      tags:
      - health
      - health
      summary: Liveness probe
      description: Return service status for infrastructure monitoring.
      operationId: liveness_api_v1_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/health/ready:
    get:
      tags:
      - health
      - health
      summary: Readiness probe
      description: Report whether dependencies (e.g. database) are reachable.
      operationId: readiness_api_v1_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /api/v1/monitoring/operational/summary:
    get:
      tags:
      - monitoring
      summary: Get operational summary dashboard
      description: 'Get comprehensive operational summary for production dashboards.


        Returns execution counts, worker health, automation status, schedule stats,

        and system health metrics.'
      operationId: get_operational_summary_api_v1_monitoring_operational_summary_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalSummaryResponse'
      security:
      - HTTPBearer: []
  /api/v1/monitoring/execution-statistics:
    get:
      tags:
      - monitoring
      summary: Get execution statistics
      description: 'Get detailed execution statistics for the specified time window.


        Returns counts by execution status, workflow distribution, and organization

        distribution.'
      operationId: get_execution_statistics_api_v1_monitoring_execution_statistics_get
      security:
      - HTTPBearer: []
      parameters:
      - name: hours
        in: query
        required: false
        schema:
          type: integer
          maximum: 168
          minimum: 1
          description: Time window in hours
          default: 24
          title: Hours
        description: Time window in hours
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionStatisticsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/monitoring/worker-statistics:
    get:
      tags:
      - monitoring
      summary: Get worker statistics
      description: 'Get worker health and activity statistics.


        Returns worker counts, health status, error distribution, and detailed worker

        information.'
      operationId: get_worker_statistics_api_v1_monitoring_worker_statistics_get
      security:
      - HTTPBearer: []
      parameters:
      - name: hours
        in: query
        required: false
        schema:
          type: integer
          maximum: 168
          minimum: 1
          description: Time window in hours
          default: 24
          title: Hours
        description: Time window in hours
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerStatisticsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/monitoring/schedule-statistics:
    get:
      tags:
      - monitoring
      summary: Get schedule statistics
      description: 'Get schedule dispatch statistics.


        Returns schedule dispatcher metrics including queued, failed, skipped, and

        conflict counts.'
      operationId: get_schedule_statistics_api_v1_monitoring_schedule_statistics_get
      security:
      - HTTPBearer: []
      parameters:
      - name: hours
        in: query
        required: false
        schema:
          type: integer
          maximum: 168
          minimum: 1
          description: Time window in hours
          default: 24
          title: Hours
        description: Time window in hours
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleStatisticsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/monitoring/retention-statistics:
    get:
      tags:
      - monitoring
      summary: Get retention statistics
      description: 'Get retention worker statistics.


        Returns retention sweep metrics including deleted execution events and

        pruned worker health records.'
      operationId: get_retention_statistics_api_v1_monitoring_retention_statistics_get
      security:
      - HTTPBearer: []
      parameters:
      - name: hours
        in: query
        required: false
        schema:
          type: integer
          maximum: 168
          minimum: 1
          description: Time window in hours
          default: 24
          title: Hours
        description: Time window in hours
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionStatisticsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/monitoring/automation-lifecycle:
    get:
      tags:
      - monitoring
      summary: Get automation lifecycle statistics
      description: 'Get automation lifecycle statistics including pause/resume events.


        Returns counts of automation pause/resume events and current automation

        status from the control service.'
      operationId: get_automation_lifecycle_api_v1_monitoring_automation_lifecycle_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationLifecycleResponse'
      security:
      - HTTPBearer: []
  /api/v1/monitoring/heartbeat-visibility:
    get:
      tags:
      - monitoring
      summary: Get worker heartbeat visibility
      description: 'Get worker heartbeat visibility for monitoring.


        Returns list of worker instances with their heartbeat status, useful for

        identifying stale or failed workers.'
      operationId: get_heartbeat_visibility_api_v1_monitoring_heartbeat_visibility_get
      security:
      - HTTPBearer: []
      parameters:
      - name: worker_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by worker type (e.g., 'execution')
          title: Worker Type
        description: Filter by worker type (e.g., 'execution')
      - name: stale_within_seconds
        in: query
        required: false
        schema:
          type: integer
          maximum: 86400
          minimum: 60
          description: Staleness window in seconds
          default: 300
          title: Stale Within Seconds
        description: Staleness window in seconds
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          description: Maximum results
          default: 100
          title: Limit
        description: Maximum results
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HeartbeatVisibilityResponse'
                title: Response Get Heartbeat Visibility Api V1 Monitoring Heartbeat Visibility Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/monitoring/execution-timeline:
    get:
      tags:
      - monitoring
      summary: Get execution timeline events
      description: 'Get recent execution timeline events across all organizations.


        Returns the latest execution events with workflow name and execution

        status/duration attached, optionally filtered by status or workflow.'
      operationId: get_execution_timeline_api_v1_monitoring_execution_timeline_get
      security:
      - HTTPBearer: []
      parameters:
      - name: hours
        in: query
        required: false
        schema:
          type: integer
          maximum: 168
          minimum: 1
          description: Time window in hours
          default: 24
          title: Hours
        description: Time window in hours
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ExecutionStatus'
          - type: 'null'
          description: Filter by execution status
          title: Status
        description: Filter by execution status
      - name: workflow
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by workflow name (partial match)
          title: Workflow
        description: Filter by workflow name (partial match)
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          description: Maximum results
          default: 100
          title: Limit
        description: Maximum results
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionTimelineResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/monitoring/execution-history:
    get:
      tags:
      - monitoring
      summary: Get execution history
      description: Get paginated execution history across all organizations.
      operationId: get_execution_history_api_v1_monitoring_execution_history_get
      security:
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number (1-based)
          default: 1
          title: Page
        description: Page number (1-based)
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: Results per page
          default: 50
          title: Page Size
        description: Results per page
      - name: hours
        in: query
        required: false
        schema:
          type: integer
          maximum: 168
          minimum: 1
          description: Time window in hours
          default: 24
          title: Hours
        description: Time window in hours
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ExecutionStatus'
          - type: 'null'
          description: Filter by execution status
          title: Status
        description: Filter by execution status
      - name: workflow
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by workflow name (partial match)
          title: Workflow
        description: Filter by workflow name (partial match)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionHistoryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/monitoring/queue-status:
    get:
      tags:
      - monitoring
      summary: Get queue status
      description: Get per-organization queue status across all organizations.
      operationId: get_queue_status_api_v1_monitoring_queue_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueStatusResponse'
      security:
      - HTTPBearer: []
  /api/v1/monitoring/monitoring-information:
    get:
      tags:
      - monitoring
      summary: Get comprehensive monitoring information
      description: Get comprehensive system, database, worker, and queue information.
      operationId: get_monitoring_information_api_v1_monitoring_monitoring_information_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringInformationResponse'
      security:
      - HTTPBearer: []
  /api/v1/auth/register:
    post:
      tags:
      - auth
      summary: Register an organization and its owner
      description: Create a new organization + owner account and return a session.
      operationId: register_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Log in with email and password
      description: Authenticate a user and return a token pair.
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/refresh:
    post:
      tags:
      - auth
      summary: Rotate a refresh token
      description: Exchange a refresh token for a new token pair (rotation).
      operationId: refresh_api_v1_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: Revoke all refresh tokens for the current user
      description: Log the user out of every device session.
      operationId: logout_api_v1_auth_logout_post
      responses:
        '204':
          description: Successful Response
      security:
      - HTTPBearer: []
  /api/v1/auth/me:
    get:
      tags:
      - auth
      summary: Return the authenticated user
      description: Return the profile of the authenticated user.
      operationId: me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
      security:
      - HTTPBearer: []
  /api/v1/auth/change-password:
    post:
      tags:
      - auth
      summary: Change the current user's password
      description: Verify the current password and set a new one (revokes other sessions).
      operationId: change_password_api_v1_auth_change_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/leads:
    post:
      tags:
      - leads
      summary: Create a lead
      description: Create a lead (dedup keys are computed by PostgreSQL).
      operationId: create_lead_api_v1_leads_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - leads
      summary: Search and filter leads
      description: Return a paginated, filtered lead list.
      operationId: list_leads_api_v1_leads_get
      security:
      - HTTPBearer: []
      parameters:
      - name: query
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Query
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/LeadStatus'
          - type: 'null'
          title: Status
      - name: source_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Source Id
      - name: owner_user_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Owner User Id
      - name: min_score
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 100
            minimum: 0
          - type: 'null'
          title: Min Score
      - name: max_score
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 100
            minimum: 0
          - type: 'null'
          title: Max Score
      - name: sort
        in: query
        required: false
        schema:
          type: string
          pattern: ^(created_at|updated_at|score|first_name|company)$
          default: created_at
          title: Sort
      - name: order
        in: query
        required: false
        schema:
          type: string
          pattern: ^(asc|desc)$
          default: desc
          title: Order
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_LeadRead_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/leads/funnel:
    get:
      tags:
      - leads
      summary: Lead counts by status
      description: Return lead counts grouped by lifecycle status.
      operationId: lead_funnel_api_v1_leads_funnel_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardLeadCounts'
      security:
      - HTTPBearer: []
  /api/v1/leads/duplicates:
    get:
      tags:
      - leads
      summary: Check for duplicate leads
      description: Return existing leads matching any normalized contact key.
      operationId: check_duplicates_api_v1_leads_duplicates_get
      security:
      - HTTPBearer: []
      parameters:
      - name: email
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Email
      - name: phone
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Phone
      - name: website
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Website
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeadRead'
                title: Response Check Duplicates Api V1 Leads Duplicates Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/leads/{lead_id}:
    get:
      tags:
      - leads
      summary: Get a lead
      description: Return a single lead.
      operationId: get_lead_api_v1_leads__lead_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: lead_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Lead Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - leads
      summary: Update a lead
      description: Partially update a lead.
      operationId: update_lead_api_v1_leads__lead_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: lead_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Lead Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - leads
      summary: Soft-delete a lead
      description: Soft-delete a lead (kept for audit, excluded from queries).
      operationId: delete_lead_api_v1_leads__lead_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: lead_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Lead Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/lead-sources:
    get:
      tags:
      - lead-sources
      summary: List lead sources
      operationId: list_sources_api_v1_lead_sources_get
      security:
      - HTTPBearer: []
      parameters:
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Include Inactive
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeadSourceRead'
                title: Response List Sources Api V1 Lead Sources Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - lead-sources
      summary: Create a lead source
      operationId: create_source_api_v1_lead_sources_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadSourceCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadSourceRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/lead-sources/{source_id}:
    get:
      tags:
      - lead-sources
      summary: Get a lead source
      operationId: get_source_api_v1_lead_sources__source_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: source_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Source Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadSourceRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - lead-sources
      summary: Update a lead source
      operationId: update_source_api_v1_lead_sources__source_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: source_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Source Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadSourceUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadSourceRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/users:
    get:
      tags:
      - users
      summary: List organization users
      operationId: list_users_api_v1_users_get
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
