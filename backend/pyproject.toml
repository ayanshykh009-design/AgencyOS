[project]
name = "agencyos-backend"
version = "0.1.0"
description = "Backend for the AI Outreach Agency Operating System"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI idiom: Query/File/Form/Depends in argument defaults

# Provider SDK wrappers call into third-party LLM SDKs (anthropic, google-genai)
# whose streaming event and types unions mypy cannot narrow, and which are
# optional runtime deps (lazy-imported, so absent in some dev environments).
# Relax only those error codes for the provider modules; all application code
# stays strict.
[[tool.mypy.overrides]]
module = "app.llm.providers.*"
disable_error_code = ["union-attr", "attr-defined", "import-not-found"]
