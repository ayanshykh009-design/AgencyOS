# ==================================================================
# AgencyOS — Production Compose
#
# Self-hosted reference deployment. Before using:
#   1. cp .env.example .env.production  and fill every value
#   2. Pin N8N_IMAGE_TAG to an audited release
#   3. Terminate TLS at a reverse proxy in front of backend/frontend
#   4. Prefer managed Supabase over the local postgres service below
#
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.production build
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
# ==================================================================

name: agencyos-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: agencyos-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - dbnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.prod
    image: agencyos-backend:${APP_VERSION:-latest}
    container_name: agencyos-prod-backend
    restart: unless-stopped
    env_file: .env.production
    environment:
      # The compose subnet hostname for Postgres overrides the localhost default.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - storage:/storage
    networks:
      - dbnet
      - appnet
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    image: agencyos-frontend:${APP_VERSION:-latest}
    container_name: agencyos-prod-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - appnet
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

  worker:
    # Standalone background workers (queues, sweeps, retention, deliveries).
    # See backend/scripts/prod/start_workers.sh for the full worker set.
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.prod
    image: agencyos-backend:${APP_VERSION:-latest}
    container_name: agencyos-prod-worker
    restart: unless-stopped
    env_file: .env.production
    environment:
      # The compose subnet hostname for Postgres overrides the localhost default.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ["sh", "/app/scripts/prod/start_workers.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - storage:/storage
    networks:
      - dbnet
      - appnet
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g

  n8n:
    # Pinned to an audited release (2.32.7). Bump deliberately and re-audit.
    image: n8nio/n8n:${N8N_IMAGE_TAG:-2.32.7}
    container_name: agencyos-prod-n8n
    restart: unless-stopped
    # Deliberately NOT env_file: .env.production. The n8n container only needs
    # its own N8N_* variables; binding the whole env file copies every secret
    # (DB, SMTP, LLM, CREDENTIALS_ENC_KEY, SECRET_KEY, ...) into n8n's process.
    environment:
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${APP_TIMEZONE:-UTC}
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8ndata:/home/node/.n8n
    # n8n persists to its own SQLite volume and does not use Postgres, and it
    # must never reach the internal database network (appnet only).
    networks:
      - appnet
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m

networks:
  # Internal database network: reachable only by services that need Postgres.
  dbnet:
    internal: true
  # Application network: backend, worker, frontend, and n8n (backend/worker
  # must reach n8n's webhook for dispatch; n8n offers workflow + static egress
  # but is isolated from the database network).
  appnet:
    driver: bridge

volumes:
  pgdata:
  n8ndata:
  storage:
