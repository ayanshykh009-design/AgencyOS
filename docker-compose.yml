# ==================================================================
# AgencyOS — Docker Compose (development)
#
# Services:
#   postgres  — local PostgreSQL dev mirror of the Supabase schema
#   n8n       — workflow automation engine
#   backend   — FastAPI (profile: full)
#   frontend  — Next.js   (profile: full)
#
# Production deployments use docker-compose.prod.yml instead.
# Start infra only:   docker compose up -d postgres n8n
# Start everything:   docker compose --profile full up -d
# ==================================================================

name: agencyos

services:
  postgres:
    image: postgres:16-alpine
    container_name: agencyos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agencyos}
      POSTGRES_USER: ${POSTGRES_USER:-agencyos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agencyos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:${N8N_IMAGE_TAG:-latest}
    container_name: agencyos-n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-true}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-change-me}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-}
      - GENERIC_TIMEZONE=${APP_TIMEZONE:-UTC}
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - ./workflows/n8n:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    image: agencyos-backend:dev
    container_name: agencyos-backend
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agencyos}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-agencyos}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./storage:/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["full"]

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    image: agencyos-frontend:dev
    container_name: agencyos-frontend
    restart: unless-stopped
    init: true
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    profiles: ["full"]

volumes:
  pgdata:
