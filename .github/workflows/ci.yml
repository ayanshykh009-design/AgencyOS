name: CI

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agencyos
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: agencyos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agencyos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Typecheck (mypy)
        run: mypy app

      - name: Test (pytest, incl. SQL-migration integration tests)
        run: |
          set -o pipefail
          pytest -rA --tb=long --junitxml=pytest-results.xml 2>&1 | tee pytest-output.log
        env:
          TEST_POSTGRES_URL: postgresql://agencyos:change-me@localhost:5432/agencyos
          # M11-B budgets are fail-closed (0 = block). The CI test suite executes
          # real AI runs, so configure a generous budget for the run environment
          # (mirrors a production deployment that has budgets set).
          AI_ORG_DAILY_TOKEN_BUDGET: "1000000"
          AI_ORG_DAILY_COST_BUDGET_USD: "1000.0"

      - name: Upload pytest diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostic-results
          path: |
            **/pytest-output.log
            **/pytest-results.xml
          if-no-files-found: warn

  frontend:
    name: Frontend lint, typecheck, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Format check (prettier)
        run: npm run format:check

      - name: Lint (eslint)
        run: npm run lint

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Test (vitest)
        run: npm test

  contract-diff:
    name: Frontend/backend contract + docs consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Verify frontend/backend API contract
        run: python scripts/ci/contract_diff.py

      - name: Verify endpoint docs consistency
        run: python scripts/ci/docs_api_consistency.py

  security:
    name: Dependency vulnerability scan
    # placeholder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Backend dependency audit (pip-audit)
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      # Gated at critical: the 3 residual "high" advisories are postcss/sharp
      # bundled inside next (not exploitable here — no next/image usage, postcss
      # is build-time only) and have no stable next release yet. Re-gate at high
      # once a next stable ships patched postcss/sharp (>= 16.3).
      - name: Frontend dependency audit (npm audit)
        run: npm audit --audit-level=critical
        working-directory: frontend

  compose:
    name: Compose config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate dev compose
        run: docker compose config --quiet

      - name: Prepare prod env file for validation
        # The prod compose references `env_file: .env.production` for its
        # services. CI only has `.env.example`, so synthesize a temporary
        # `.env.production` from it (no secrets are introduced — `.env.example`
        # contains only non-sensitive placeholders) purely for `config` validation.
        run: cp .env.example .env.production

      - name: Validate prod compose
        run: docker compose -f docker-compose.prod.yml --env-file .env.example config --quiet

      - name: Remove temporary prod env file
        if: always()
        run: rm -f .env.production
