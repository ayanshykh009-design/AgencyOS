name: CI

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agencyos
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: agencyos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agencyos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Real Redis so the R2 resend-cooldown tests prove atomic SET NX EX and
      # cross-instance sharing instead of mocking the distributed guarantee.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Typecheck (mypy)
        run: mypy app

      - name: Test (pytest, incl. SQL-migration integration tests)
        run: |
          set -o pipefail
          pytest -rA --tb=short --junitxml=pytest-results.xml 2>&1 | tee pytest-output.log
          exit ${PIPESTATUS[0]}
        env:
          TEST_POSTGRES_URL: postgresql://agencyos:change-me@localhost:5432/agencyos
          TEST_REDIS_URL: redis://localhost:6379/0
          # M11-B budgets are fail-closed (0 = block). The CI test suite executes
          # real AI runs, so configure a generous budget for the run environment
          # (mirrors a production deployment that has budgets set).
          AI_ORG_DAILY_TOKEN_BUDGET: "1000000"
          AI_ORG_DAILY_COST_BUDGET_USD: "1000.0"

      # The module only skips when TEST_REDIS_URL is absent, so this step passing
      # proves the atomic/cross-instance cooldown tests actually executed rather
      # than being silently skipped inside the full suite.
      - name: Resend cooldown atomicity (real Redis)
        run: pytest -q tests/integration/test_resend_cooldown_redis.py
        env:
          TEST_REDIS_URL: redis://localhost:6379/0

  frontend:
    name: Frontend lint, typecheck, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify committed lockfile is unchanged
        run: git diff --exit-code -- package-lock.json package.json

      - name: Format check (prettier)
        run: npm run format:check

      - name: Lint (eslint)
        run: npm run lint

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Test (vitest)
        run: npm test

      - name: Build (next build)
        run: npm run build

  contract-diff:
    name: Frontend/backend contract + docs consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Verify frontend/backend API contract
        run: python scripts/ci/contract_diff.py

      - name: Verify endpoint docs consistency
        run: python scripts/ci/docs_api_consistency.py

      - name: Verify committed OpenAPI snapshot matches the live app
        run: |
          python scripts/regen-openapi.py
          git diff --exit-code -- docs/api/openapi.yaml

  security:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Backend dependency audit (pip-audit)
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Verify committed lockfile is unchanged
        run: git diff --exit-code -- frontend/package-lock.json frontend/package.json

      # The audited lockfile has zero moderate-or-higher advisories. Zod was
      # upgraded to 4.6.7 and the typescript-eslint chain to 8.73.0, which
      # resolves the minimatch advisory; fail the gate on any regression.
      - name: Frontend dependency audit (npm audit)
        run: npm audit --audit-level=moderate
        working-directory: frontend

  compose:
    name: Compose config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate dev compose
        run: docker compose config --quiet

      - name: Prepare prod env file for validation
        # The prod compose references `env_file: .env.production` for its
        # services. CI only has `.env.example`, so synthesize a temporary
        # `.env.production` from it (no secrets are introduced — `.env.example`
        # contains only non-sensitive placeholders) purely for `config` validation.
        run: cp .env.example .env.production

      - name: Validate prod compose
        run: docker compose -f docker-compose.prod.yml --env-file .env.example config --quiet

      - name: Remove temporary prod env file
        if: always()
        run: rm -f .env.production
